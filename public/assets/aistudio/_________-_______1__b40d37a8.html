<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>দৈনিক আয়-ব্যয়</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7690;--pr:#5b5bf0;--pr2:#8a5cf6;--gr:#12b886;--rd:#f0506e;--bd:#e6e9f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1320;--card:#1a2033;--tx:#eef1fa;--mu:#9aa5c4;--bd:#272f48}}
:root[data-theme="dark"]{--bg:#0f1320;--card:#1a2033;--tx:#eef1fa;--mu:#9aa5c4;--bd:#272f48}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 96px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-top:14px}
.hero{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-radius:24px;padding:20px;margin-top:14px}
.hero small{opacity:.85}.hero h1{font-size:34px;margin:2px 0 14px}
.row{display:flex;gap:10px}.row>*{flex:1}
.pill{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 12px}
.pill b{display:block;font-size:18px}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:16px;margin-top:10px}
button{font:inherit;cursor:pointer;border:0}
.btn{width:100%;margin-top:12px;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;font-weight:600;font-size:16px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.nav div{display:flex;max-width:520px;width:100%}
.nav button{flex:1;background:none;color:var(--mu);padding:8px;font-size:13px;border-radius:12px}
.nav button span{display:block;font-size:20px}
.nav button.on{color:var(--pr);font-weight:600}
.mon{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.mon button{background:var(--card);border:1px solid var(--bd);color:var(--tx);width:38px;height:38px;border-radius:12px;font-size:18px}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.ic{width:42px;height:42px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:20px}
.item .m{flex:1;min-width:0}.item .m small{color:var(--mu)}
.amt{font-weight:700}.out{color:var(--rd)}.in{color:var(--gr)}
.x{background:none;color:var(--mu);font-size:18px;padding:4px}
.bar{height:8px;border-radius:8px;background:var(--bg);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2));border-radius:8px}
h2{font-size:17px}.mu{color:var(--mu);font-size:14px}.empty{text-align:center;color:var(--mu);padding:18px 0}
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;text-align:center}
.logo{font-size:56px}
.clk{display:flex;align-items:baseline;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 14px}
.clk b{font-size:22px;color:var(--pr)}.clk span{color:var(--mu);font-size:14px}
.hide{display:none}
.sg{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:14px}.sb{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;padding:0;border:0;cursor:pointer;text-decoration:none;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.top .tg{margin:0}
.hb{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}.hb svg{width:36px;height:36px;filter:drop-shadow(0 3px 6px rgba(91,91,240,.35))}
#prn{display:none}
@media print{body>*:not(#prn){display:none!important}#prn{display:block;padding:12px;color:#1b2333;font-family:'Hind Siliguri',sans-serif}}
.tg{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
.tg button{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:6px 14px;font-size:14px;font-weight:600}
.al{background:rgba(240,80,110,.12);border:1px solid rgba(240,80,110,.45);color:var(--rd);border-radius:16px;padding:12px 14px;margin-top:14px;display:flex;gap:10px;align-items:center}
.mdl{position:fixed;inset:0;background:rgba(10,14,30,.55);display:grid;place-items:center;padding:20px;z-index:50}
.mb{background:var(--card);border-radius:24px;padding:24px;max-width:340px;width:100%;text-align:center}
.mb .big{font-size:46px}
#rep{position:fixed;left:-9999px;top:0;width:720px;background:#fff;color:#1b2333;padding:32px;font-family:'Hind Siliguri',sans-serif}
.splash{background:linear-gradient(160deg,#5b5bf0,#8a5cf6 60%,#c05cf6);color:#fff;border-radius:28px;padding:30px 20px 24px;text-align:center;margin-top:14px;position:relative;overflow:hidden}
.splash:before,.splash:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.splash:before{width:180px;height:180px;top:-70px;right:-60px}.splash:after{width:120px;height:120px;bottom:-50px;left:-40px}
.splash svg{filter:drop-shadow(0 8px 16px rgba(0,0,0,.25));position:relative}.cov{width:100%;max-width:340px;height:auto}.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;position:relative}.brand svg{width:46px;height:46px}.brand h1{margin:0!important;font-size:26px!important}
.splash h1{font-size:30px;margin-top:10px;position:relative}.splash p{opacity:.9;margin-top:4px;position:relative}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;position:relative}
.chips span{background:rgba(255,255,255,.2);border-radius:20px;padding:6px 12px;font-size:13px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const CATS0={food:['🍚','খাবার'],transport:['🚌','যাতায়াত'],wifi:['📶','ওয়াইফাই বিল'],elec:['💡','বিদ্যুৎ বিল'],gas:['🔥','গ্যাস বিল'],snack:['🥪','নাস্তা'],dps:['🏦','DPS / সঞ্চয়'],rent:['🏠','বাসা ভাড়া'],shop:['🛍️','কেনাকাটা'],health:['💊','চিকিৎসা'],edu:['📚','শিক্ষা'],fun:['🎬','বিনোদন'],other:['📦','অন্যান্য']};
const SRC0={salary:['💼','বেতন'],business:['🏪','ব্যবসা'],freelance:['💻','ফ্রিল্যান্স'],bal:['📱','মোবাইল/ইন্টারনেট ব্যালেন্স'],gift:['🎁','উপহার'],other:['💰','অন্যান্য']};
const fbk={get:(o,k)=>k in o?o[k]:['📦','অন্যান্য']};const CATS=new Proxy(CATS0,fbk),SRC=new Proxy(SRC0,fbk);
const MNE=['January','February','March','April','May','June','July','August','September','October','November','December'];const MNB=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];let MN=MNB,lang='bn',_m;
const bn=n=>Number(n).toLocaleString(lang==='en'?'en-US':'bn-BD');
const tk=n=>'৳'+bn(Math.round(n));
let mem={},user=null,tab='home',cur=new Date();cur.setDate(1);
const st={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
let data={tx:[]};
function load(){try{data=JSON.parse(st.get('h_'+user))||{tx:[]}}catch(e){data={tx:[]}}if(!data.tx)data.tx=[];if(!data.loans)data.loans=[];data.tx.forEach(t=>{if(t.cat==='bill')t.cat='other'})}
function save(){st.set('h_'+user,JSON.stringify(data))}
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function opts(o){return Object.entries(o).map(([k,v])=>`<option value="${k}">${v[0]} ${v[1]}</option>`).join('')}
const LOGO=`<svg viewBox="0 0 96 96"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4ae0"/><stop offset="1" stop-color="#9a5cf6"/></linearGradient></defs><rect width="96" height="96" rx="26" fill="#fff"/><rect x="6" y="6" width="84" height="84" rx="21" fill="url(#lg)"/><rect x="20" y="26" width="56" height="50" rx="12" fill="#fff"/><path d="M20 38a12 12 0 0 1 12-12h32a12 12 0 0 1 12 12v4H20z" fill="#f0506e"/><rect x="32" y="18" width="6" height="16" rx="3" fill="#fff"/><rect x="58" y="18" width="6" height="16" rx="3" fill="#fff"/><text x="48" y="68" text-anchor="middle" font-size="26" font-weight="700" fill="#5b5bf0" font-family="sans-serif">৳</text></svg>`;
const COVER=`<svg class="cov" viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="gw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e6e3ff"/></linearGradient><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffb703"/></linearGradient></defs><g fill="#fff" opacity=".75"><circle cx="38" cy="30" r="3"/><circle cx="322" cy="30" r="4"/><circle cx="196" cy="170" r="2.5"/><circle cx="14" cy="100" r="2"/><circle cx="346" cy="120" r="2.5"/><path d="M180 12l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><path d="M100 34l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></g><g fill="#fff" opacity=".88"><rect x="272" y="124" width="16" height="42" rx="4"/><rect x="294" y="102" width="16" height="64" rx="4"/><rect x="316" y="78" width="16" height="88" rx="4"/></g><path d="M266 108L296 88L324 62" stroke="#7CFFCB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="324" cy="62" r="6" fill="#7CFFCB"/><g transform="rotate(-8 170 70)"><rect x="124" y="34" width="96" height="50" rx="8" fill="#7CFFCB"/><circle cx="172" cy="59" r="13" fill="#12b886"/><text x="172" y="65" text-anchor="middle" font-size="17" fill="#fff" font-weight="700">৳</text></g><rect x="100" y="76" width="148" height="92" rx="16" fill="url(#gw)"/><path d="M100 92a16 16 0 0 1 16-16h116a16 16 0 0 1 16 16v6H100z" fill="#f0506e"/><rect x="198" y="112" width="56" height="30" rx="10" fill="#5b5bf0"/><circle cx="214" cy="127" r="6" fill="#fff"/><g><ellipse cx="62" cy="168" rx="32" ry="10" fill="#e09f00"/><rect x="30" y="152" width="64" height="16" fill="#ffb703"/><ellipse cx="62" cy="152" rx="32" ry="10" fill="#e09f00"/><rect x="30" y="136" width="64" height="16" fill="#ffb703"/><ellipse cx="62" cy="136" rx="32" ry="10" fill="url(#gc)"/><text x="62" y="141" text-anchor="middle" font-size="15" fill="#b57900" font-weight="700">৳</text></g></svg>`;
function users(){try{return JSON.parse(st.get('h_users'))||{}}catch(e){return {}}}
function login(m){
 const mode=m||(Object.keys(users()).length?'in':'reg'),reg=mode==='reg';_m=mode;
 document.getElementById('app').innerHTML=`${tgl()}<div class="splash">${COVER}<div class="brand">${LOGO}<h1>দৈনিক আয়-ব্যয়</h1></div><p>প্রতিদিনের খরচ আর মাসিক আয়ের স্মার্ট হিসাব</p><div class="chips"><span>🧾 দৈনিক খরচ</span><span>💰 মাসিক আয়</span><span>📊 খাতভিত্তিক হিসাব</span></div></div><div class="card"><h2>${reg?'নতুন রেজিস্ট্রেশন':'লগইন'}</h2>${reg?'<input id="nm" placeholder="আপনার নাম">':''}<input id="ph" type="tel" inputmode="numeric" maxlength="11" placeholder="মোবাইল নম্বর (01XXXXXXXXX)"><p id="er" class="out mu"></p><button class="btn" onclick="${reg?'doReg()':'doLogin()'}">${reg?'রেজিস্ট্রেশন করুন':'প্রবেশ করুন'}</button>${reg?'<p class="mu" style="font-size:13px;text-align:center;margin-top:10px">রেজিস্ট্রেশন করলে নিচের গোপনীয়তা নীতি প্রযোজ্য হবে।</p>':''}<p class="mu" style="margin-top:12px;text-align:center">${reg?'আগে রেজিস্ট্রেশন করেছেন?':'নতুন ব্যবহারকারী?'} <a href="#" onclick="login('${reg?'in':'reg'}');return false" style="color:var(--pr);font-weight:600">${reg?'লগইন করুন':'রেজিস্ট্রেশন করুন'}</a></p></div><p style="text-align:center;margin-top:14px"><a href="#" onclick="shareScr();return false" class="mu">📣 শেয়ার</a> &nbsp;·&nbsp; <a href="#" onclick="privacy();return false" class="mu">🔒 গোপনীয়তা নীতি</a> &nbsp;·&nbsp; <a href="#" onclick="adminGate();return false" class="mu">🔒 অ্যাডমিন</a></p>`;tr(document.getElementById('app'));
}
function phone(){const p=document.getElementById('ph').value.trim();if(!/^01[3-9]\d{8}$/.test(p)){err('সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন');return null}return p}
function err(t){document.getElementById('er').textContent=T(t)}
function enter(p){user=p;st.set('h_user',p);load();tab='home';render()}
function doReg(){
 const n=document.getElementById('nm').value.trim();
 if(!n){err('আপনার নাম লিখুন');return}
 const p=phone();if(!p)return;
 const u=users();
 if(u[p]){err('এই নম্বর দিয়ে আগেই রেজিস্ট্রেশন হয়েছে। লগইন করুন।');return}
 u[p]={name:n,ts:Date.now()};st.set('h_users',JSON.stringify(u));enter(p);
}
function doLogin(){
 const p=phone();if(!p)return;
 if(!users()[p]){err('এই নম্বরটি নিবন্ধিত নয়। আগে রেজিস্ট্রেশন করুন।');return}
 enter(p);
}
function logout(){st.set('h_user','');user=null;login()}
function mine(){return data.tx.filter(t=>t.date.startsWith(ym(cur)))}
function render(){
 if(!user)return login();touch();
 const tx=mine(),inc=tx.filter(t=>t.type==='in').reduce((a,t)=>a+t.amt,0),exp=tx.filter(t=>t.type==='out').reduce((a,t)=>a+t.amt,0);
 let h=`<div class="top"><div class="hb">${LOGO}<b>দৈনিক আয়-ব্যয়</b></div>${tgl()}</div>`+(tx.length&&inc-exp<=(cfg.limit??2000)?`<div class="al" style="margin:0 0 12px"><span style="font-size:26px">🔔</span><div><b>ব্যালেন্স সতর্কতা!</b><div style="font-size:14px">আপনার ব্যালেন্স ${tk(inc-exp)}, যা ${tk(cfg.limit??2000)} বা তার কম</div></div></div>`:'')+`<div class="clk"><b id="ck"></b><span id="dt"></span></div><div class="mon" style="${tab==='loan'?'display:none':''}"><button onclick="mv(-1)">‹</button><h2>${MN[cur.getMonth()]} ${bn(cur.getFullYear())}</h2><button onclick="mv(1)">›</button></div>`;
 if(tab==='home'){
  h+=`<div class="hero"><small>অবশিষ্ট ব্যালেন্স</small><h1>${tk(inc-exp)}</h1><div class="row"><div class="pill"><small>আয়</small><b>${tk(inc)}</b></div><div class="pill"><small>খরচ</small><b>${tk(exp)}</b></div></div></div>`;
  const by={};tx.filter(t=>t.type==='out').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
  h+=`<div class="card"><h2>খাত অনুযায়ী খরচ</h2>`;
  const e=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  h+=e.length?e.map(([k,v])=>`<div style="margin-top:14px"><div style="display:flex;justify-content:space-between"><span>${CATS[k][0]} ${CATS[k][1]}</span><b>${tk(v)}</b></div><div class="bar"><i style="width:${v/exp*100}%"></i></div></div>`).join(''):'<div class="empty">এই মাসে কোনো খরচ নেই</div>';
  h+=`</div>`;
  const days=new Set(tx.filter(t=>t.type==='out').map(t=>t.date)).size;
  if(days)h+=`<div class="card"><span class="mu">দৈনিক গড় খরচ</span><h2 style="font-size:22px">${tk(exp/days)}</h2></div>`;
  h+=`<div class="card"><h2>সাম্প্রতিক লেনদেন</h2>${list(tx.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,5))}</div>`;
  h+=`<div class="card"><h2>📄 মাসিক রিপোর্ট</h2><p class="mu">${MN[cur.getMonth()]} মাসের পুরো হিসাব PDF করে সংরক্ষণ করুন</p><button class="btn" onclick="pdf()">PDF ডাউনলোড করুন</button></div>${shareCard()}<div class="card"><h2>⚙️ অ্যাকাউন্ট</h2><button class="btn" style="background:var(--bg);color:var(--tx);border:1px solid var(--bd)" onclick="privacy()">🔒 গোপনীয়তা নীতি</button><button class="btn" style="background:var(--rd)" onclick="delMe()">🗑️ অ্যাকাউন্ট মুছে ফেলুন</button></div>`;
 }else if(tab==='loan'){
  const lo=data.loans,sum=k=>lo.filter(l=>l.kind===k&&!l.done).reduce((a,l)=>a+l.amt-(l.paid||0),0),pend=lo.filter(l=>!l.done).sort((a,b)=>b.date.localeCompare(a.date)),done=lo.filter(l=>l.done);
  h+=`<div class="row" style="margin-top:14px"><div class="card" style="margin:0"><small class="mu">আমি দেব</small><b class="out" style="display:block;font-size:22px">${tk(sum('borrow'))}</b></div><div class="card" style="margin:0"><small class="mu">আমি পাব</small><b class="in" style="display:block;font-size:22px">${tk(sum('lend'))}</b></div></div>
<div class="card"><h2>নতুন ধার যোগ করুন</h2><select id="lk"><option value="borrow">🤝 ধার নেওয়া</option><option value="lend">💸 ধার দেওয়া</option></select><input id="ln" placeholder="ব্যক্তির নাম"><input id="la" type="number" inputmode="decimal" placeholder="টাকার পরিমাণ"><input id="ld" type="date" value="${today()}"><input id="lt" placeholder="নোট (ঐচ্ছিক)"><button class="btn" onclick="addLoan()">যোগ করুন</button></div>
<div class="card"><h2>বাকি তালিকা</h2>${pend.length?loanList(pend):'<div class="empty">কোনো ধার নেই</div>'}</div>${done.length?`<div class="card"><h2>শোধ হওয়া তালিকা</h2>${loanList(done)}</div>`:''}`;

 js.forEach((j,i)=>{const p=3+3*i,cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';

<h3 style="margin-top:14px">${L('২. তথ্য কোথায় থাকে','2. Where it is kept')}</h3><p class="mu">${L('সব তথ্য আপনার ফোনের ব্রাউজারের স্থানীয় স্টোরেজে জমা থাকে। অ্যাপ এই তথ্য কোনো সার্ভারে পাঠায় না।','All data is kept in your phone browser’s local storage. The app does not send this data to any server.')}</p>
<h3 style="margin-top:14px">${L('৩. তথ্যের ব্যবহার','3. How it is used')}</h3><p class="mu">${L('তথ্য শুধু আপনার হিসাব দেখানো ও রিপোর্ট তৈরির কাজে ব্যবহার হয়। এতে কোনো বিজ্ঞাপন নেই, আর তথ্য বিক্রি বা কারও সঙ্গে শেয়ার করা হয় না। মোবাইল নম্বর OTP দিয়ে যাচাই করা হয় না।','Data is used only to show your records and build reports. There are no ads, and data is not sold or shared. Your mobile number is not verified by OTP.')}</p>
<h3 style="margin-top:14px">${L('৪. তৃতীয় পক্ষের সেবা','4. Third-party services')}</h3><p class="mu">${L('ইন্টারনেট থাকলে অ্যাপ Google Fonts থেকে ফন্ট এবং cdnjs থেকে PDF তৈরির টুল লোড করে। এই সেবাগুলো আপনার আইপি ঠিকানা দেখতে পারে। আপনার হিসাবের তথ্য তাদের কাছে যায় না।','When online, the app loads fonts from Google Fonts and PDF tools from cdnjs. These services can see your IP address. Your records are not sent to them.')}</p>
<h3 style="margin-top:14px">${L('৫. একই ফোন ভাগ করলে','5. Sharing a phone')}</h3><p class="mu">${L('লগইনে পাসওয়ার্ড নেই। একই ফোন ও ব্রাউজারে আপনার নম্বর জানা কেউ আপনার হিসাব খুলতে পারে। অ্যাডমিন প্যানেল সেই ফোনে নিবন্ধিত সবার নাম, নম্বর ও শেষ সক্রিয় তারিখ দেখাতে পারে।','There is no password at login. Anyone who knows your number can open your records on the same phone and browser. The admin panel can show the names, numbers and last-active dates of everyone registered on that phone.')}</p>
<h3 style="margin-top:14px">${L('৬. তথ্য মুছে ফেলা','6. Deleting your data')}</h3><p class="mu">${L('হোম পেজের নিচে “অ্যাকাউন্ট” অংশ থেকে “অ্যাকাউন্ট মুছে ফেলুন” চাপলে আপনার অ্যাকাউন্ট ও সব হিসাব স্থায়ীভাবে মুছে যায়, ফেরানো যায় না। ব্রাউজারের ডেটা মুছলেও তথ্য চলে যায়।','Tap “Delete account” in the “Account” section at the bottom of the home page to permanently delete your account and all records. This cannot be undone. Clearing your browser data also removes it.')}</p>
<h3 style="margin-top:14px">${L('৭. নীতির পরিবর্তন','7. Changes')}</h3><p class="mu">${L('নীতি বদলালে এই পেজে হালনাগাদ করা হবে।','If this policy changes, it will be updated on this page.')}</p>
<button class="btn" onclick="exitAdmin()">${L('ফিরে যান','Back')}</button></div>`}
function delMe(){ask(L('আপনার অ্যাকাউন্ট ও সব হিসাব (খরচ, আয়, ধার) স্থায়ীভাবে মুছে যাবে। এটি ফেরানো যাবে না। নিশ্চিত?','Your account and all records (expenses, income, loans) will be permanently deleted. This cannot be undone. Sure?'),()=>{const u=users();delete u[user];st.set('h_users',JSON.stringify(u));st.del('h_'+user);st.del('h_user');user=null;data={tx:[],loans:[]};tab='home';login('reg')})}
const APP_URL='https://claude.ai/artifact/91Vr6m7TGW88wFZCPbjsKQ';

const IC={

ms:'<svg viewBox="0 0 24 24" width="26" height="26"><path fill="#fff" d="M12 2.5C6.8 2.5 2.8 6.3 2.8 11.2c0 2.6 1.2 4.9 3.1 6.4v3.9l3.6-2c.8.2 1.6.3 2.5.3 5.2 0 9.2-3.8 9.2-8.6S17.2 2.5 12 2.5z"/><path fill="#0084FF" d="M6.8 14.2l3.4-3.7 2.6 2.2 3.6-2.8-3.2 4-2.6-2.2z"/></svg>',

function shareCard(){const u=encodeURIComponent(APP_URL),t=encodeURIComponent(shareTxt()),a=(c,n,i,h)=>`<a class="sb" style="background:${c}" title="${n}" aria-label="${n}" href="${h}" target="_blank" rel="noopener">${IC[i]}</a>`;
 return `<div class="card"><h2>📣 ${L('বন্ধুদের সাথে শেয়ার করুন','Share with friends')}</h2><div class="sg">${navigator.share?`<button class="sb" style="background:var(--pr)" title="${L('শেয়ার','Share')}" aria-label="${L('শেয়ার','Share')}" onclick="nativeShare()">${IC.sh}</button>`:''}${a('#25D366','WhatsApp','wa','https://wa.me/?text='+t+'%20'+u)}${a('#1877F2','Facebook','fb','https://www.facebook.com/sharer/sharer.php?u='+u)}${a('#0084FF','Messenger','ms','fb-messenger://share/?link='+u)}${a('#229ED9','Telegram','tg','https://t.me/share/url?url='+u+'&text='+t)}${a('#111','X','x','https://twitter.com/intent/tweet?text='+t+'&url='+u)}<button class="sb" style="background:#6b7690" title="${L('লিংক কপি','Copy link')}" aria-label="${L('লিংক কপি','Copy link')}" onclick="copyLink()">${IC.cp}</button></div></div>`}
function nativeShare(){try{navigator.share({title:L('দৈনিক আয়-ব্যয়','Daily Income & Expense'),text:shareTxt(),url:APP_URL}).catch(()=>{})}catch(e){}}
function copyLink(){const done=()=>msg(L('লিংক কপি হয়েছে','Link copied'),'✅');function fb(){const t=document.createElement('textarea');t.value=APP_URL;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}t.remove();done()}try{navigator.clipboard.writeText(APP_URL).then(done,fb)}catch(e){fb()}}
function shareScr(){scr=shareScr;$('app').innerHTML=tgl()+shareCard()+`<button class="btn" onclick="exitAdmin()">${L('ফিরে যান','Back')}</button>`}
function exitAdmin(){scr=null;adm=false;user?render():login(_m)}
function allData(){const u=users(),o=[];for(const p in u){let d;try{d=JSON.parse(st.get('h_'+p))||{tx:[]}}catch(e){d={tx:[]}}o.push([p,u[p],d.tx||[]])}return o}
function delUser(p){ask(L('এই ব্যবহারকারী ও তার সব হিসাব মুছে যাবে। নিশ্চিত?','This user and all their records will be deleted. Sure?'),()=>{const u=users();delete u[p];st.set('h_users',JSON.stringify(u));st.del('h_'+p);adminPanel()})}
(async()=>{try{if(window.claude){const u=await claude.use('user');if(u&&u.isOwner()){isOwn=true;redo()}}}catch(e){}})();
function touch(){const u=users(),t=today();if(u[user]&&u[user].d!==t){u[user].d=t;u[user].days=(u[user].days||[]).concat(t).slice(-60);st.set('h_users',JSON.stringify(u))}}
function wk(u){const c=new Date();c.setDate(c.getDate()-6);const k=c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0')+'-'+String(c.getDate()).padStart(2,'0');return (u.days||[]).some(d=>d>=k)}
function act(u){if(!u.d)return L('এখনও সক্রিয় হয়নি','No activity yet');const t=u.d===today();return (t?'🟢 '+L('আজ সক্রিয়','Active today'):'⚪ '+L('শেষ সক্রিয়: ','Last active: ')+DG(u.d.slice(8))+'/'+DG(u.d.slice(5,7)))+' · '+bn((u.days||[]).length)+' '+L('দিন','days')}
function adminPanel(){
 if(!isOwn&&!adm)return;scr=adminPanel;const A=allData().sort((a,b)=>(b[1].d||'').localeCompare(a[1].d||''));
 $('app').innerHTML=tgl()+`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:22px">🛠 ${L('অ্যাডমিন প্যানেল','Admin panel')}</h2><button class="x" style="font-size:15px;color:var(--pr);font-weight:600" onclick="exitAdmin()">${L('বের হন','Exit')}</button></div>
<div class="hero"><small>${L('মোট নিবন্ধিত ব্যবহারকারী','Total registered users')}</small><h1 style="margin-bottom:6px">${bn(A.length)}</h1><small>🟢 ${L('আজ সক্রিয়','Active today')}: <b>${bn(A.filter(x=>x[1].d===today()).length)}</b> · ${L('গত ৭ দিনে','Last 7 days')}: <b>${bn(A.filter(x=>wk(x[1])).length)}</b></small></div>
<div class="card"><h2>👥 ${L('ব্যবহারকারী তালিকা','Users')}</h2>${A.map(([p,u])=>`<div class="item"><div class="ic" style="${u.d===today()?'background:rgba(18,184,134,.2)':''}">${u.d===today()?'🟢':'👤'}</div><div class="m"><div>${esc(u.name||L('নাম নেই','No name'))}</div><small>${DG(p)} · ${act(u)}</small></div><button class="x" onclick="delUser('${p}')">✕</button></div>`).join('')||`<div class="empty">${L('কেউ নেই','No users')}</div>`}</div>
<p class="mu" style="text-align:center;margin-top:12px">${L('শুধু এই ফোনের ব্যবহারকারী দেখানো হচ্ছে','Showing users on this device only')}</p>`}
function loanList(a){return a.map(l=>{const d=new Date(l.date);return `<div class="item" style="${l.done?'opacity:.55':''}"><div class="ic">${l.kind==='borrow'?'🤝':'💸'}</div><div class="m"><div style="${l.done?'text-decoration:line-through':''}">${esc(l.name)}</div><small>${l.kind==='borrow'?'ধার নেওয়া':'ধার দেওয়া'} · ${bn(d.getDate())} ${MN[d.getMonth()]}${l.paid&&!l.done?' · পরিশোধিত '+tk(l.paid)+' / '+tk(l.amt):''}${l.note?' · '+esc(l.note):''}</small>${hist(l)}</div><div style="text-align:right"><div class="amt ${l.kind==='borrow'?'out':'in'}">${tk(l.done?l.amt:l.amt-(l.paid||0))}</div><button class="x" style="font-size:13px;color:var(--pr)" onclick="${l.done?'loanDone':'payModal'}(${l.id})">${l.done?'↩ আবার খুলুন':'➕ পরিশোধ'}</button></div><button class="x" onclick="delLoan(${l.id})">✕</button></div>`}).join('')}
function addLoan(){const n=$('ln').value.trim(),a=parseFloat($('la').value);if(!n||!(a>0)){(n?$('la'):$('ln')).focus();return}data.loans.push({id:Date.now(),kind:$('lk').value,name:n,amt:a,date:$('ld').value||today(),note:$('lt').value.trim(),done:false});save();render()}
function loanDone(id){const l=data.loans.find(x=>x.id===id);if(l){l.done=!l.done;if(!l.done){l.paid=0;l.pays=[]}save();render()}}
function dfmt(x){const d=new Date(x);return bn(d.getDate())+' '+MN[d.getMonth()]+' '+bn(d.getFullYear())}
function hist(l){const a=l.pays||(l.paid?[{d:'',a:l.paid}]:[]);return a.map(p=>`<small style="display:block;color:var(--gr)">↳ ${p.d?dfmt(p.d):'তারিখ নেই'} · ${l.kind==='borrow'?'ফেরত দিয়েছি':'ফেরত পেয়েছি'} ${tk(p.a)}</small>`).join('')}
function payModal(id){const l=data.loans.find(x=>x.id===id);if(!l)return;const rem=l.amt-(l.paid||0),m=document.createElement('div');m.className='mdl';m.innerHTML=`<div class="mb"><div class="big">💵</div><p style="margin:10px 0">${esc(l.name)} · ${L('বাকি','Remaining')} ${tk(rem)}</p><input id="pa" type="number" inputmode="decimal" value="${rem}"><input id="pd" type="date" value="${today()}"><div class="row"><button class="btn" style="background:var(--bg);color:var(--tx);border:1px solid var(--bd)" onclick="this.closest('.mdl').remove()">${L('বাতিল','Cancel')}</button><button class="btn" onclick="loanPay(${id})">${L('নিশ্চিত','Confirm')}</button></div></div>`;document.body.appendChild(m)}
function loanPay(id){const l=data.loans.find(x=>x.id===id),v=parseFloat($('pa').value);if(!l||!(v>0))return;const pv=Math.min(v,l.amt-(l.paid||0));l.pays=(l.pays||(l.paid?[{d:'',a:l.paid}]:[])).concat({d:$('pd').value||today(),a:pv});l.paid=Math.min(l.amt,(l.paid||0)+v);l.done=l.paid>=l.amt;document.querySelector('.mdl').remove();save();render()}
function delLoan(id){data.loans=data.loans.filter(x=>x.id!==id);save();render()}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function add(type){
 const a=parseFloat(document.getElementById('a').value);if(!(a>0)){document.getElementById('a').focus();return}
 const d=document.getElementById('d').value||today();
 data.tx.push({id:Date.now(),type,amt:a,cat:document.getElementById('c').value,date:d,note:document.getElementById('n').value.trim()});
 save();cur=new Date(d);cur.setDate(1);render();
}
function del(id){data.tx=data.tx.filter(t=>t.id!==id);save();render()}
function go(t){tab=t;render();window.scrollTo(0,0)}
function mv(n){cur.setMonth(cur.getMonth()+n);render()}
try{const c=JSON.parse(st.get('h_cfg'));if(c){cfg=c;if(c.cats){for(const k in CATS0)delete CATS0[k];Object.assign(CATS0,c.cats)}if(c.src){for(const k in SRC0)delete SRC0[k];Object.assign(SRC0,c.src)}}}catch(e){}
lang=st.get('h_lang')==='en'?'en':'bn';MN=lang==='en'?MNE:MNB;document.documentElement.lang=lang;const th=st.get('h_theme');if(th)document.documentElement.dataset.theme=th;
user=st.get('h_user');if(user){const u=users();if(!u[user]){u[user]={name:'',ts:Date.now()};st.set('h_users',JSON.stringify(u))}load()}render();
</script>
